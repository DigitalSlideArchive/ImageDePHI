---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    groups:
      client-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      client-security:
        applies-to: security-updates
        patterns:
          - "*"
